<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Set Darla owner PIN</title><style>body{font:20px system-ui;max-width:550px;margin:50px auto;padding:20px}label,input,button{display:block;margin:16px 0}input,button{font:inherit;padding:12px}input{width:85%}</style><h1>Set your Darla owner PIN</h1><p>Choose 6 to 12 digits. Enter this PIN on your phone keypad when using private owner commands.</p><form id="setup"><label for="pin">New PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{6,12}" required><label for="confirm">Confirm PIN</label><input id="confirm" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{6,12}" required><button>Save my PIN</button></form><p id="result" role="status"></p><script type="module" src="/owner/pin/setup.js"></script></html>
